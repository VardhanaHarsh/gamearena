# Render Blueprint — creates the whole GameArena stack on Render's free tier:
#   • gamearena      — web service (Docker): API + WebSockets + the built React app
#   • gamearena-db   — managed PostgreSQL (source of truth for all credits)
#   • gamearena-redis — managed Key Value (Redis-compatible) for presence, snapshots, rate limits
# Secrets are generated by Render; nothing secret is stored in this file.
services:
  - type: web
    name: gamearena
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DEMO_MODE
        value: "true"
      - key: SIGNUP_BONUS_CREDITS
        value: 1000
      - key: SEED_ON_START
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: gamearena-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gamearena-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: LOG_LEVEL
        value: info

  - type: keyvalue
    name: gamearena-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal network only

databases:
  - name: gamearena-db
    plan: free
    databaseName: gamearena
    user: gamearena
    ipAllowList: [] # internal network only
